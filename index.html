<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tien.java 🐍</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #0d1117;
            color: white;

            font-family: Arial, sans-serif;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 20px;
        }

        canvas {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 10px;
        }

        .score {
            margin-top: 15px;
            font-size: 18px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;

            border: none;
            border-radius: 8px;

            background: #238636;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #2ea043;
        }

        .message {
            margin-top: 10px;
            color: #8b949e;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>Tien.java 🐍</h1>

    <div class="subtitle">
        Eat the activity. Become the developer.
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <button id="restart">
        Restart
    </button>

    <div class="message">
        Use ↑ ↓ ← → to move
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const restartButton = document.getElementById("restart");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake;
let food;
let direction;
let nextDirection;
let score;
let gameLoop;


function startGame() {

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    food = createFood();

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    scoreElement.textContent = score;

    clearInterval(gameLoop);

    gameLoop = setInterval(update, 100);
}


function createFood() {

    let newFood;

    do {

        newFood = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };

    } while (
        snake.some(
            part => part.x === newFood.x && part.y === newFood.y
        )
    );

    return newFood;
}


function update() {

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Wall collision
    if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ) {
        gameOver();
        return;
    }

    // Self collision
    if (
        snake.some(
            part => part.x === head.x && part.y === head.y
        )
    ) {
        gameOver();
        return;
    }

    snake.unshift(head);

    // Eat activity
    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreElement.textContent = score;

        food = createFood();

    } else {

        snake.pop();

    }

    draw();
}


function draw() {

    // Background
    ctx.fillStyle = "#161b22";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Draw grid
    for (let x = 0; x < tileCount; x++) {

        for (let y = 0; y < tileCount; y++) {

            ctx.fillStyle =
                (x + y) % 2 === 0
                    ? "#161b22"
                    : "#11161c";

            ctx.fillRect(
                x * gridSize,
                y * gridSize,
                gridSize,
                gridSize
            );
        }
    }


    // Food
    ctx.fillStyle = "#f0883e";

    ctx.fillRect(
        food.x * gridSize + 3,
        food.y * gridSize + 3,
        gridSize - 6,
        gridSize - 6
    );


    // Snake
    snake.forEach((part, index) => {

        ctx.fillStyle =
            index === 0
                ? "#58a6ff"
                : "#3fb950";

        ctx.fillRect(
            part.x * gridSize + 2,
            part.y * gridSize + 2,
            gridSize - 4,
            gridSize - 4
        );

    });
}


function gameOver() {

    clearInterval(gameLoop);

    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "white";

    ctx.font = "28px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "Game Over 💀",
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.font = "16px Arial";

    ctx.fillText(
        "Restart and try again!",
        canvas.width / 2,
        canvas.height / 2 + 35
    );
}


document.addEventListener("keydown", function(event) {

    const key = event.key;

    if (
        key === "ArrowUp" &&
        direction.y !== 1
    ) {
        nextDirection = {
            x: 0,
            y: -1
        };
    }

    if (
        key === "ArrowDown" &&
        direction.y !== -1
    ) {
        nextDirection = {
            x: 0,
            y: 1
        };
    }

    if (
        key === "ArrowLeft" &&
        direction.x !== 1
    ) {
        nextDirection = {
            x: -1,
            y: 0
        };
    }

    if (
        key === "ArrowRight" &&
        direction.x !== -1
    ) {
        nextDirection = {
            x: 1,
            y: 0
        };
    }

});


restartButton.addEventListener(
    "click",
    startGame
);


startGame();

</script>

</body>
</html>
